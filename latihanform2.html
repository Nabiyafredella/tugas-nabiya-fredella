<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form biodata siswa</title>
</head>
<body>
  <hr>
    <center>
        <h3> FORM BIODATA SISWA </h3>
    </center>
    <hr>

    <form>
      NIM : <input type="text">
         <br></br>
       Nama lengkap : <input type="text">
         <br></br>
       kelas : <select name="class">
         <option value="x">X</option>
         <option value="xi">XI</option>
         <option value="xii">XII</option>
       </select>
       <br></br>
       jurusan : <input type="radio" name="major" value="teknik informatika"> teknik informatika
       <input type="radio" name="major" value="sistem informasi"> sistem informasi    
       <input type="radio" name="major" value="multimedia"> multimedia
       
       <br></br>
       Tempat tanggal lahir : <input type="text"> <select name="date">  
           <option value="Tanggal">Tanggal</option>
            <option value="pilih tahun">1</option>
            <option value="pilih tahun">2</option>
            <option value="pilih tahun">3</option>  
            <option value="pilih tahun">4</option>
            <option value="pilih tahun">5</option>
            <option value="pilih tahun">6</option>
            <option value="pilih tahun">7</option>
            <option value="pilih tahun">8</option>
            <option value="pilih tahun">9</option>
            <option value="pilih tahun">10</option>
        </select> 
         
          <select name="month">
           <option value="Bulan">Bulan</option>
              <option value="januari">Januari</option>
                <option value="februari">Februari</option>
                <option value="maret">Maret</option>
                <option value="april">April</option>
                <option value="mei">Mei</option>
                <option value="juni">Juni</option>
                <option value="juli">Juli</option>
                <option value="agustus">Agustus</option>
                <option value="september">September</option>
                <option value="oktober">Oktober</option>
                <option value="november">November</option>
                <option value="desember">Desember</option>
         </select>
        
        <select name="year">
           <option value="Tahun">Tahun</option>
              <option value="2001">2001</option>
              <option value="2002">2002</option>
              <option value="2003">2003</option>
              <option value="2004">2004</option>
              <option value="2005">2005</option>
              <option value="2006">2006</option>
              <option value="2007">2007</option>
              <option value="2008">2008</option>
              <option value="2009">2009</option>
              <option value="2010">2010</option>
            </select>

         <br></br>  
         umur : <input type="number">
       </select>
       <br></br>         
       jenis kelamin : <input type="radio" name="gender" value="laki-laki"> Laki-laki
       <input type="radio" name="gender" value="perempuan"> Perempuan
         <br></br>
         Alamat : <input type="text">
         <br></br>
         email : <input type="email"> @ <select name="email">
           <option value="gmail">gmail</option>
           <option value="yahoo">yahoo</option>
           <option value="outlook">outlook</option>
         </select>
         <br></br> 
         
                <input type="submit" value="Submit">
                <input type="reset" value="cancel">
    </form>
</body>
</html>
