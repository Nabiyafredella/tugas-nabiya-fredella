<!DOCTYPE html>
<html>
<head>
    <title>Form Biodata Siswa</title>
</head>
<body>

<center>
<h2>FORM BIODATA SISWA</h2>

<form>
<table>
    <tr>
        <td>NIM</td>
        <td>:</td>
        <td><input type="text"></td>
    </tr>

    <tr>
        <td>Nama Lengkap</td>
        <td>:</td>
        <td><input type="text" size="40"></td>
    </tr>

    <tr>
        <td>Kelas</td>
        <td>:</td>
        <td>
            <select>
                <option>X</option>
                <option>XI</option>
                <option>XII</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Jurusan</td>
        <td>:</td>
        <td>
            <input type="radio" name="jurusan"> Teknik Informatika
            <input type="radio" name="jurusan"> Sistem Informasi
            <input type="radio" name="jurusan"> Multimedia
        </td>
    </tr>

    <tr>
        <td>Tempat dan Tanggal Lahir</td>
        <td>:</td>
        <td>
            <input type="text">

            <select>
                <option>Tanggal</option>
            </select>

            <select>
                <option>Bulan</option>
            </select>

            <select>
                <option>Tahun</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Jenis Kelamin</td>
        <td>:</td>
        <td>
            <input type="radio" name="jk"> Laki-laki
            <input type="radio" name="jk"> Perempuan
        </td>
    </tr>

    <tr>
        <td>Alamat</td>
        <td>:</td>
        <td><input type="text" size="40"></td>
    </tr>

    <tr>
        <td>Email</td>
        <td>:</td>
        <td>
            <input type="text">
            @
            <select>
                <option>gmail.com</option>
                <option>yahoo.com</option>
                <option>outlook.com</option>
            </select>
        </td>
    </tr>

    <tr>
        <td></td>
        <td></td>
        <td>
            <input type="submit" value="Submit">
            <input type="reset" value="Cancel">
        </td>
    </tr>

</table>
</form>
</center>

</body>
</html>
